# Modern SaaS look: indigo accent, white surfaces, tinted cards, Inter.
# Rose, amber and emerald mark risk levels.

[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F6FA"
textColor = "#1E1B4B"
linkColor = "#4F46E5"
linkUnderline = false
borderColor = "#E5E7EB"
showWidgetBorder = true
baseRadius = "10px"
buttonRadius = "10px"

font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeBackgroundColor = "#F1F5F9"
codeTextColor = "#1E1B4B"
baseFontSize = 15
headingFontWeights = [700, 600, 600, 600, 600, 600]
headingFontSizes = ["32px", "24px", "20px", "17px", "15px", "14px"]

grayColor = "#64748B"
blueColor = "#4F46E5"
redColor = "#E11D48"
orangeColor = "#D97706"
yellowColor = "#CA8A04"
greenColor = "#059669"
violetColor = "#4F46E5"

dataframeBorderColor = "#E5E7EB"
dataframeHeaderBackgroundColor = "#F5F6FA"
chartCategoricalColors = ["#4F46E5", "#059669", "#E11D48", "#D97706", "#64748B", "#0891B2", "#7C3AED"]
